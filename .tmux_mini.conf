set -g mouse on 
set -g base-index 1
set -g set-clipboard on 
set -g renumber-windows on 
set -g allow-passthrough on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
setw -g mode-keys vi
setw -g pane-base-index 1

set -g status-position top
set -g status-style "bg=#3c3836,fg=#a89984"
set -g status-right " #[fg=#689d6a]#{USER}#[default]@#[fg=#689d6a]#h[#[default]#S#[fg=#689d6a]] #[default]%b %d #[fg=#689d6a]%a #[default]%H:%M "

setw -g window-status-format " #[fg=#689d6a]#I#[default]:#W "
setw -g window-status-style "bg=#3c3836,fg=#a89984"
setw -g window-status-current-format "#[bg=#282828,fg=#689d6a,bold] #I "
setw -g window-status-current-style "bg=#3c3836,fg=#a89984"

set -g pane-border-style "fg=#a89984"
set -g pane-active-border-style "fg=#689d6a"
