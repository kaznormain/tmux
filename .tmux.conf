set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

set -g status-position top
set -g status-style "bg=#3c3836,fg=#ebdbb2"
set -g status-left "#[bg=#d79921,fg=#3c3836,bold] #S #[default,nobold] "
set -g status-right "#[bg=#504946,fg=#a89984,bold]  %H:%M #[bg=#665c54,fg=#bdae93,nobold] %b %d │ %a #[bg=#bdae93,fg=#3c3836] #{USER}@#h "

setw -g window-status-format "#[bg=#504946,fg=#bdae93,bold] #I #[bg=default,fg=#504946, nobold]#[default] "
setw -g window-status-style "bg=#3c3836,fg=#ebdbb2"
setw -g window-status-current-format "#[bg=#282828,fg=#fabd2f,bold] #I: #W #[bg=default,fg=#282828,nobold]#[default] "
setw -g window-status-current-style "bg=#3c3836,fg=#ebdbb2"

set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#d5c4a1"
