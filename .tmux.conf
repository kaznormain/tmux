set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

set -g status-position top
set -g status-style "bg=#3c3836,fg=#ebdbb2"
set -g status-left "#[bg=#d79921,fg=#3c3836,bold] #S #[default,nobold] "
set -g status-right "#[fg=#504946]#[bg=#504946,fg=#bdae93]  %H:%M #[default] #[fg=#504946]#[bg=#504946,fg=#bdae93] %b %d #[default] #[bg=default,fg=#504946]#[bg=#504946,fg=#bdae93] %a #[default] #[bg=#bdae93,fg=#3c3836,bold] #{USER}#[nobold]@#[bold]#h "

setw -g window-status-format "#[bg=#504946,fg=#bdae93,bold] #I: #W #[bg=default,fg=#504946, nobold]#[default] "
setw -g window-status-style "bg=#3c3836,fg=#ebdbb2"
setw -g window-status-current-format "#[bg=#282828,fg=#fabd2f,bold] #I: #W #[bg=default,fg=#282828,nobold]#[default] "
setw -g window-status-current-style "bg=#3c3836,fg=#ebdbb2"

set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#d5c4a1"
